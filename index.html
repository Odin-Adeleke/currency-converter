<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Currency Converter 8-Bit</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0c1e;
  --panel: #1b1f3b;
  --edge: #f4f4f4;
  --shadow: #2b2f57;
  --accent: #ffd23f;
  --green: #3cff7a;
  --red: #ff4d6d;
  --text: #f4f4f4;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "Press Start 2P", monospace;
  font-size: 12px;
  line-height: 1.8;
  padding: 24px 16px;
  display: flex;
  justify-content: center;
  image-rendering: pixelated;
}
body::after {
  content: "";
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 4px);
  pointer-events: none;
}
.wrap { width: 100%; max-width: 560px; }
h1 { font-size: 16px; color: var(--accent); text-align: center; margin: 0 0 6px; text-shadow: 3px 3px 0 #000; }
.sub { text-align: center; color: #9aa3d6; font-size: 9px; margin-bottom: 20px; }
.box {
  background: var(--panel);
  border: 4px solid var(--edge);
  box-shadow: 0 0 0 4px #000, 8px 8px 0 4px #000;
  padding: 18px;
  margin-bottom: 22px;
}
label { display: block; font-size: 9px; color: #9aa3d6; margin-bottom: 6px; }
input, select, button {
  font-family: inherit;
  font-size: 12px;
  color: var(--text);
  background: #0b0c1e;
  border: 4px solid var(--edge);
  padding: 10px;
  width: 100%;
  border-radius: 0;
  outline: none;
}
input:focus, select:focus { border-color: var(--accent); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.swap-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; margin-bottom: 14px; }
.swap { width: auto; padding: 10px 14px; cursor: pointer; background: var(--shadow); }
button { cursor: pointer; background: var(--accent); color: #0b0c1e; border-color: #000; box-shadow: 4px 4px 0 #000; }
button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #000; }
.result {
  text-align: center;
  padding: 14px;
  background: #000;
  border: 4px solid var(--green);
  color: var(--green);
  min-height: 60px;
  word-break: break-word;
  margin-top: 6px;
}
.status { margin-top: 14px; font-size: 9px; color: #9aa3d6; text-align: center; }
.status.err { color: var(--red); }
.blink::after { content: "_"; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (max-width: 480px) { body { font-size: 10px; } .row, .swap-row { grid-template-columns: 1fr; } .swap { width: 100%; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>CURRENCY CONVERTER</h1>
  <div class="sub">PLAYER 1 · EXCHANGE MODE</div>

  <div class="box">
    <label for="amount">AMOUNT</label>
    <input id="amount" type="number" min="0" step="any" value="100">

    <div class="swap-row" style="margin-top:14px">
      <div>
        <label for="from">FROM</label>
        <select id="from"></select>
      </div>
      <button class="swap" id="swap" title="Swap currencies">&lt;&gt;</button>
      <div>
        <label for="to">TO</label>
        <select id="to"></select>
      </div>
    </div>

    <button id="convert">CONVERT!</button>
    <div class="result" id="result"><span class="blink">READY</span></div>
    <div class="status" id="status">RATES: BUILT-IN</div>
    <div style="margin-top:14px"><button id="live">GET LIVE RATES</button></div>
  </div>
</div>

<script>
// Built-in rates (USD base). Keep these in sync with rates.json.
const DATA = { base: "USD", source: "BUILT-IN", rates: { USD: 1.0, CAD: 1.37, THB: 34.25, EUR: 0.92, GBP: 0.79, MYR: 4.2 } };
const LIVE_URL = "https://open.er-api.com/v6/latest/USD";

const amountEl = document.getElementById("amount");
const fromEl = document.getElementById("from");
const toEl = document.getElementById("to");
const resultEl = document.getElementById("result");
const statusEl = document.getElementById("status");

function fillSelects() {
  const codes = Object.keys(DATA.rates).sort();
  for (const el of [fromEl, toEl]) {
    el.innerHTML = "";
    for (const c of codes) {
      const o = document.createElement("option");
      o.value = c; o.textContent = c;
      el.appendChild(o);
    }
  }
  fromEl.value = "CAD";
  toEl.value = "THB";
}

function convert() {
  const amount = parseFloat(amountEl.value);
  if (!isFinite(amount) || amount < 0) {
    resultEl.textContent = "ENTER A VALID AMOUNT";
    return;
  }
  const from = fromEl.value, to = toEl.value;
  const value = (amount / DATA.rates[from]) * DATA.rates[to];
  resultEl.textContent = `${amount.toLocaleString()} ${from} = ${value.toLocaleString(undefined, { maximumFractionDigits: 2 })} ${to}`;
}

async function getLiveRates() {
  statusEl.className = "status";
  statusEl.textContent = "LOADING LIVE RATES...";
  try {
    const res = await fetch(LIVE_URL);
    const data = await res.json();
    if (data.result !== "success") throw new Error("bad response");
    DATA.rates = data.rates;
    DATA.base = data.base_code;
    DATA.source = "LIVE";
    const keep = { from: fromEl.value, to: toEl.value };
    fillSelects();
    fromEl.value = keep.from; toEl.value = keep.to;
    statusEl.textContent = "RATES: LIVE";
    convert();
  } catch (e) {
    statusEl.className = "status err";
    statusEl.textContent = "LIVE RATES FAILED. USING BUILT-IN.";
  }
}

document.getElementById("convert").addEventListener("click", convert);
document.getElementById("live").addEventListener("click", getLiveRates);
document.getElementById("swap").addEventListener("click", () => {
  const f = fromEl.value; fromEl.value = toEl.value; toEl.value = f; convert();
});
amountEl.addEventListener("input", convert);
fromEl.addEventListener("change", convert);
toEl.addEventListener("change", convert);

fillSelects();
convert();
</script>
</body>
</html>
